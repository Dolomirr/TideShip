symbol = " "
style = "fg: blue bold bg:black"
heuristic = true
disabled = false
detect_extensions = ["csproj", "fsproj", "xproj"]
detect_files = [
  "global.json",
  "project.json",
  "Directory.Build.props",
  "Directory.Build.targets",
  "Packages.props",
]
detect_folders = []

[maven]
format = "[$symbol($version )]($style)"
version_format = "${major}.${minor}"
symbol = " "
style = "bold bright-cyan bg:black"
disabled = false
recursive = false
detect_extensions = []
detect_files = ["pom.xml"]
detect_folders = [".mvn"]

[deno]
symbol = " "

[meson]
truncation_length = 4294967295
truncation_symbol = "…"
format = "[$symbol$project]($style) "
symbol = "󰔷 "
style = "blue bold bg:black"
