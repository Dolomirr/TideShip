[pixi]
pixi_binary = ["pixi"]
show_default_environment = true
format = "[$symbol($version )(\\($environment\\) )]($style)"
version_format = "${major}.${minor}"
symbol = "󰏗 "
style = "yellow bold"
disabled = false
detect_extensions = []
detect_files = ["pixi.toml", "pixi.lock"]
detect_folders = []

[pulumi]
symbol = " "

[shell]
format = "[$indicator]($style)"
bash_indicator = ""
# fish_indicator = "" # considered default
fish_indicator = ""
zsh_indicator = "󰬇"
powershell_indicator = ""
ion_indicator = ""
elvish_indicator = "󰘧"
tcsh_indicator = "󰬁"
nu_indicator = ""
xonsh_indicator = "🐚"
cmd_indicator = ""
unknown_indicator = ""
style = "white"
disabled = false

[shlvl]
symbol = "󰹍 "

[singularity]
symbol = " "

[solidity]
symbol = " "

[spack]
symbol = " "

[status]
format = "[$symbol$status ]($style)"
symbol = ""
success_symbol = ""
success_style = "green"
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = "󰟾"
signal_symbol = "⚡"
failure_style = "red"

disabled = false


[terraform]
symbol = " "


[username]
detect_env_vars = []
format = "[$user]($style)"
style_root = "red bold"
style_user = "yellow bold"
show_always = false
disabled = false
[username.aliases]


[custom]
