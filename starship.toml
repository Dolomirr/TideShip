"$schema" = "https://starship.rs/config-schema.json"

format = """\
[╭─](fg:gray)\
[\
[](bold black)\
$shell \
$sudo\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
](bg:black)\
[](fg:black bg:none)\
$container\
\
$fill\
\
$status\
$jobs\
[](fg:black bg:none)\
$package\
$docker_context\
$cmake\
$gradle\
$maven\
$xmake\
$guix_shell\
$conda\
$pixi\
$meson\
$spack\
$mise\
\
$bun\
$dotnet\
$nodejs\
\
$c\
$cobol\
$cpp\
$dart\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$haskell\
$haxe\
$java\
$julia\
$kotlin\
$lua\
$mojo\
$nim\
$ocaml\
$odin\
$perl\
$php\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$vlang\
$zig\
$crystal\
$typst\
\
\n\
[╰─](fg:gray)\
$character\
"""

## good to have
# $cmd_duration\

## something sensible
# $nix_shell\
# $memory_usage\
# $direnv\
# $custom\
# $battery\
# $env_var\
# $line_break\
# $os\
# $shell\
# $username\
# $hostname\
# $localip\
# $shlvl\


right_format = """\
"""

add_newline = false


continuation_prompt = "[∙](bright-black) "

palette = 'tide'

[fill]
symbol = " "
disabled = false

[character]
format = "$symbol "
success_symbol = "[❯](#5FD700)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[▶](green)"
vimcmd_replace_one_symbol = "[󱨉](green)"
vimcmd_replace_symbol = "[󱨉]green)"
vimcmd_visual_symbol = "[󱪼](green)"
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 1
use_logical_path = true
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "bg:black fg:bold cyan"
before_repo_root_style = "bg:black fg:cyan"
repo_root_style = "bg:black fg:bold cyan"
read_only = " "
read_only_style = "fg:red bg:black"
truncation_symbol = ""
use_os_path_sep = true
# [directory.substitutions]
# "Documents" = "󰈙"
# "Downloads" = ""
# "Music" = ""
# "Pictures" = ""
# "Templates" = ""
# "Projects" = ""


[palettes.tide]
red = "#D70000"
green = "#5FD700"
gray = "#444444"
light-gray = "#A1A1A1"
black = "#1C1C1C"
cyan = "#00AFFF"


[profiles]
transient = """
\u0020\
$character\
"""

## VCS

[package]
format = "[$symbol$version │]($style) "
symbol = "󰏗 "
style = "fg:light-gray bg:black"
display_private = false
disabled = false
version_format = "v${raw}"

[vcs]
order = ["git", "hg", "pijul", "fossil"]
disabled = false
git_modules = "$git_branch$git_commit$git_state$git_metrics$git_status"
hg_modules = "$hg_branch$hg_state"
fossil_modules = "$fossil_branch$fossil_metrics"
pijul_modules = "$pijul_channel"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = "[╱ ](bg:black fg:light-gray)"
style = "bg:black fg:bright-green"
truncation_length = 9223372036854775807
truncation_symbol = "…"
only_attached = false
always_show_remote = false
ignore_branches = []
ignore_bare_repo = false
disabled = false

[git_commit]
commit_hash_length = 7
format = "[\\($hash$tag\\)]($style) "
style = "fg:green bold bg:black"
only_detached = true
disabled = false
tag_symbol = '  '
tag_disabled = true
tag_max_candidates = 0

[git_metrics]
added_style = "fg: bold green bg:black"
deleted_style = "bold red"
only_nonzero_diffs = true
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled = true
ignore_submodules = false

[git_state]
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
style = "fg: bold yellow bg:black"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
disabled = false

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style)[ ](bg:black))"
style = "red bold bg:black"
stashed = "\\$"
ahead = "⇡"
behind = "⇣"
up_to_date = ""
diverged = "⇕"
conflicted = "="
deleted = "✘"
renamed = "»"
modified = "!"
staged = "+"
untracked = "?"
typechanged = ""
worktree_added = ""
worktree_deleted = ""
worktree_modified = ""
worktree_typechanged = ""
index_added = ""
index_deleted = ""
index_modified = ""
index_typechanged = ""
ignore_submodules = false
disabled = false
use_git_executable = false

[pijul_channel]
symbol = " "

[vcsh]
symbol = ""
style = "bold yellow bg:black"
format = "vcsh [$symbol$repo]($style) "
disabled = false

[hg_branch]
symbol = " "

[fossil_branch]
symbol = " "

## RUNTIMES + BUILD SYSTEMS
[bun]
format = "[$symbol($version )]($style)"
version_format = ""
symbol = " "
style = "bold red bg:black"
disabled = false
detect_extensions = []
detect_files = ["bun.lock", "bun.lockb", "bunfig.toml"]
